name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: shop
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw" --health-interval 2s --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client mysql-client
      - run: pip install -e .[dev]
      - name: Seed MySQL
        run: mysql -h 127.0.0.1 -uroot -ppw shop < examples/compose/shop.sql
      - name: Tests
        env:
          PGFEDERATE_TEST_POSTGRES: postgresql://postgres:pw@127.0.0.1:5432/postgres
          PGFEDERATE_TEST_MYSQL: host=127.0.0.1 port=3306 user=root password=pw database=shop
        run: pytest

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        working-directory: examples/compose
        run: docker compose up -d --build --wait --wait-timeout 300 crm shop api gateway && docker compose up -d metabase grafana
      - name: Grafana and Metabase through their PostgreSQL drivers
        run: timeout 900 python3 tests/e2e/run.py
      - name: Logs
        if: always()
        working-directory: examples/compose
        run: docker compose logs --no-color --tail 200 gateway; docker compose logs --no-color --tail 80 metabase
