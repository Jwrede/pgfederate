[project]
name = "pgfederate"
version = "0.1.0"
description = "One read-only PostgreSQL endpoint over PostgreSQL, MySQL, SQLite, files and REST APIs, backed by DuckDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jonathan Wrede" }]
dependencies = [
    "duckdb>=1.4",
    "sqlglot>=27",
    "pyyaml>=6",
    "pytz",
]

[project.optional-dependencies]
dev = ["pytest", "psycopg[binary]", "asyncpg"]

[project.scripts]
pgfederate = "pgfederate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgfederate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
